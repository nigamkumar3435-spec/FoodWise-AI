{% extends 'base.html' %}
{% block title %}Login — FoodWise AI{% endblock %}
{% block content %}
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm border-0 rounded-3 p-4">
        <div class="text-center mb-4">
          <i class="fas fa-leaf fa-2x text-success mb-2"></i>
          <h4 class="fw-bold">Welcome Back</h4>
          <p class="text-muted small">Sign in to your FoodWise AI account</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <input type="password" name="password" id="password" class="form-control" placeholder="Your password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember" id="remember">
            <label class="form-check-label text-muted small" for="remember">Keep me signed in</label>
          </div>
          <button type="submit" class="btn btn-success w-100 fw-semibold">
            <i class="fas fa-sign-in-alt me-2"></i>Log In
          </button>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="text-success fw-semibold">Register here</a>
        </p>
      </div>
      <p class="text-center text-muted small mt-3">
        Demo accounts: <strong>demo.canteen@foodwise.ai</strong> or <strong>demo.ngo@foodwise.ai</strong> — Password: <strong>Demo@1234</strong>
      </p>
    </div>
  </div>
</div>
{% endblock %}
