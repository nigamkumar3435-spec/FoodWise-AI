{% extends 'base.html' %}
{% block title %}Register — FoodWise AI{% endblock %}
{% block content %}
<div class="container">
  <div class="row justify-content-center my-5">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm border-0 rounded-3 p-4">
        <div class="text-center mb-4">
          <i class="fas fa-leaf fa-2x text-success mb-2"></i>
          <h4 class="fw-bold">Create Your Account</h4>
          <p class="text-muted small">Join FoodWise AI to start reducing food waste</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate id="registerForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Role Selection -->
          <div class="mb-3">
            <label class="form-label fw-semibold">I am a</label>
            <select name="role" id="roleSelect" class="form-select" onchange="toggleRoleFields()">
              <option value="provider" {% if form_data.get('role','provider')=='provider' %}selected{% endif %}>
                Food Provider (Restaurant / Canteen / Hotel / Hostel / Caterer)
              </option>
              <option value="ngo" {% if form_data.get('role')=='ngo' %}selected{% endif %}>
                NGO / Food Bank (Food Receiver)
              </option>
            </select>
          </div>

          <!-- Common fields -->
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Full Name</label>
              <input type="text" name="full_name" class="form-control" value="{{ form_data.get('full_name','') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email Address</label>
              <input type="email" name="email" class="form-control" value="{{ form_data.get('email','') }}" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ form_data.get('phone','') }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <input type="password" name="password" id="reg_password" class="form-control" required minlength="8">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('reg_password',this)"><i class="fas fa-eye"></i></button>
              </div>
              <div class="form-text">Minimum 8 characters.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Confirm Password</label>
              <input type="password" name="confirm_password" class="form-control" required>
            </div>
          </div>

          <!-- Provider fields -->
          <div id="providerFields" class="mt-3">
            <hr><h6 class="text-muted">Organization Details</h6>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Organization Name</label>
                <input type="text" name="organization_name" class="form-control" value="{{ form_data.get('organization_name','') }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Organization Type</label>
                <select name="organization_type" class="form-select">
                  <option value="restaurant">Restaurant</option>
                  <option value="canteen">College Canteen</option>
                  <option value="hotel">Hotel</option>
                  <option value="hostel">Hostel</option>
                  <option value="catering">Catering Service</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" name="city" class="form-control" value="{{ form_data.get('city','') }}">
              </div>
            </div>
          </div>

          <!-- NGO fields -->
          <div id="ngoFields" class="mt-3 d-none">
            <hr><h6 class="text-muted">NGO / Food Bank Details</h6>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">NGO / Organization Name</label>
                <input type="text" name="ngo_organization_name" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" name="city" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Daily Meal Capacity</label>
                <input type="number" name="capacity" class="form-control" placeholder="e.g. 500 meals/day" min="0">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Accepted Food Categories</label>
                <input type="text" name="accepted_categories" class="form-control"
                       placeholder="e.g. rice, dal, bread, vegetables (comma-separated)">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 mt-4 fw-semibold">
            <i class="fas fa-user-plus me-2"></i>Create Account
          </button>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Already have an account?
          <a href="{{ url_for('auth.login') }}" class="text-success fw-semibold">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script>
function toggleRoleFields() {
  const role = document.getElementById('roleSelect').value;
  document.getElementById('providerFields').classList.toggle('d-none', role !== 'provider');
  document.getElementById('ngoFields').classList.toggle('d-none', role !== 'ngo');
}
// Init
toggleRoleFields();
</script>
{% endblock %}
