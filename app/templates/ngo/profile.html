{% extends 'base.html' %}
{% block title %}NGO Profile — FoodWise AI{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h4 class="fw-bold mb-4"><i class="fas fa-cog text-success me-2"></i>NGO Profile</h4>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Organization Name</label>
                <input type="text" name="organization_name" class="form-control" value="{{ org.organization_name if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" name="city" class="form-control" value="{{ org.city if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Daily Capacity (meals)</label>
                <input type="number" name="capacity" class="form-control" value="{{ org.capacity | int if org else 0 }}" min="0">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Address</label>
                <input type="text" name="address" class="form-control" value="{{ org.address if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Latitude</label>
                <input type="number" name="latitude" class="form-control" step="0.0001" value="{{ org.latitude if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Longitude</label>
                <input type="number" name="longitude" class="form-control" step="0.0001" value="{{ org.longitude if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Contact Number</label>
                <input type="tel" name="contact_number" class="form-control" value="{{ org.contact_number if org else '' }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Accepted Food Categories</label>
                <input type="text" name="accepted_categories" class="form-control"
                       value="{{ org.accepted_food_categories if org else '' }}"
                       placeholder="e.g. rice, dal, bread, vegetables">
                <div class="form-text">Comma-separated categories you can accept.</div>
              </div>
            </div>
            <button type="submit" class="btn btn-success mt-4 fw-semibold px-4">
              <i class="fas fa-save me-2"></i>Save Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
