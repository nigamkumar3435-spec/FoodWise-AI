{% extends 'base.html' %}
{% block title %}{{ 'Edit' if record else 'Add' }} Food Record — FoodWise AI{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="mb-4">
        <h4 class="fw-bold mb-0">
          <i class="fas fa-{{ 'edit' if record else 'plus' }} text-success me-2"></i>
          {{ 'Edit' if record else 'Add' }} Food History Record
        </h4>
        <p class="text-muted small mb-0">{{ org.organization_name }}</p>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
                <input type="date" name="date" class="form-control"
                       value="{{ record.date.isoformat() if record else today }}" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Meal Type <span class="text-danger">*</span></label>
                <select name="meal_type" class="form-select" required>
                  <option value="breakfast" {% if record and record.meal_type=='breakfast' %}selected{% endif %}>Breakfast</option>
                  <option value="lunch" {% if not record or record.meal_type=='lunch' %}selected{% endif %}>Lunch</option>
                  <option value="dinner" {% if record and record.meal_type=='dinner' %}selected{% endif %}>Dinner</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">People Served <span class="text-danger">*</span></label>
                <input type="number" name="number_of_people" class="form-control"
                       value="{{ record.number_of_people if record else '' }}" min="1" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Food Prepared (meals) <span class="text-danger">*</span></label>
                <input type="number" name="food_prepared" class="form-control"
                       value="{{ record.food_prepared | int if record else '' }}" min="0" step="1" required
                       id="preparedInput" oninput="calcSurplus()">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Food Consumed (meals) <span class="text-danger">*</span></label>
                <input type="number" name="food_consumed" class="form-control"
                       value="{{ record.food_consumed | int if record else '' }}" min="0" step="1" required
                       id="consumedInput" oninput="calcSurplus()">
              </div>
              <div class="col-12">
                <div class="alert alert-light border py-2 mb-0" id="surplusPreview">
                  <span class="fw-semibold">Surplus:</span> <span id="surplusVal">—</span> meals
                  &nbsp;|&nbsp;
                  <span class="fw-semibold">Waste:</span> <span id="wasteVal">—</span>%
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Event Type</label>
                <select name="event_type" class="form-select">
                  {% for ev in ['normal','holiday','festival','college_event','weekend','conference'] %}
                  <option value="{{ ev }}" {% if record and record.event_type==ev %}selected{% endif %}>
                    {{ ev | replace('_',' ') | title }}
                  </option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Weather</label>
                <select name="weather_condition" class="form-select">
                  {% for w in ['clear','cloudy','rainy','hot','cold'] %}
                  <option value="{{ w }}" {% if record and record.weather_condition==w %}selected{% endif %}>{{ w | title }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Temperature (°C)</label>
                <input type="number" name="temperature" class="form-control"
                       value="{{ record.temperature if record else 28 }}" step="0.5">
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" name="holiday" id="holidayCheck"
                         {% if record and record.holiday %}checked{% endif %}>
                  <label class="form-check-label" for="holidayCheck">Public holiday?</label>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-success fw-semibold px-4">
                <i class="fas fa-save me-2"></i>{{ 'Update' if record else 'Save' }} Record
              </button>
              <a href="{{ url_for('provider.history') }}" class="btn btn-outline-secondary px-4">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function calcSurplus() {
  const p = parseFloat(document.getElementById('preparedInput').value) || 0;
  const c = parseFloat(document.getElementById('consumedInput').value) || 0;
  const surplus = Math.max(p - c, 0);
  const waste = p > 0 ? ((surplus / p) * 100).toFixed(1) : 0;
  document.getElementById('surplusVal').textContent = surplus.toFixed(0);
  document.getElementById('wasteVal').textContent = waste;
  document.getElementById('surplusPreview').className =
    'alert border py-2 mb-0 ' + (waste > 20 ? 'alert-danger' : waste > 10 ? 'alert-warning' : 'alert-success');
}
</script>
{% endblock %}
