{% extends 'base.html' %}
{% block title %}Profile — FoodWise AI{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h4 class="fw-bold mb-4"><i class="fas fa-cog text-success me-2"></i>Organization Profile</h4>
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Your Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Organization Name</label>
                <input type="text" name="organization_name" class="form-control" value="{{ org.organization_name if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Organization Type</label>
                <select name="organization_type" class="form-select">
                  {% for t in ['restaurant','canteen','hotel','hostel','catering'] %}
                  <option value="{{ t }}" {% if org and org.organization_type == t %}selected{% endif %}>{{ t | title }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" name="city" class="form-control" value="{{ org.city if org else '' }}">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Address</label>
                <input type="text" name="address" class="form-control" value="{{ org.address if org else '' }}">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Latitude</label>
                <input type="number" name="latitude" class="form-control" step="0.0001"
                       value="{{ org.latitude if org else '' }}" placeholder="e.g. 12.9716">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Longitude</label>
                <input type="number" name="longitude" class="form-control" step="0.0001"
                       value="{{ org.longitude if org else '' }}" placeholder="e.g. 77.5946">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Contact Number</label>
                <input type="tel" name="contact_number" class="form-control" value="{{ org.contact_number if org else '' }}">
              </div>
            </div>
            <button type="submit" class="btn btn-success mt-4 fw-semibold px-4">
              <i class="fas fa-save me-2"></i>Save Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
